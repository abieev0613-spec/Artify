<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Artify | Track Order</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .track-hero {
            max-width: 900px;
            margin: auto;
        }

        .track-form {
            display: flex;
            gap: 12px;
            max-width: 650px;
            margin-top: 22px;
        }

        .track-form input {
            flex: 1;
            min-width: 0;
        }

        .track-result {
            margin-top: 28px;
        }

        .track-meta {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .track-meta > div {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 18px;
            border-radius: 14px;
        }

        .track-meta small {
            display: block;
            color: var(--muted);
            margin-bottom: 7px;
        }

        .track-timeline {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 25px;
        }

        .track-step {
            padding: 18px 12px;
            border: 1px solid var(--line);
            border-radius: 14px;
            text-align: center;
            background: var(--surface);
            color: var(--muted);
        }

        .track-step .dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--line);
            margin: 0 auto 12px;
        }

        .track-step.done {
            border-color: var(--accent);
            color: var(--text);
        }

        .track-step.done .dot {
            background: var(--accent);
            color: #fff;
        }

        .track-error {
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-top: 18px;
        }

        @media (max-width: 600px) {
            .track-form {
                flex-direction: column;
            }

            .track-meta,
            .track-timeline {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="container page-pad">

        <section class="track-hero">

            <div class="eyebrow">
                FROM OUR STUDIO TO YOUR DOOR
            </div>

            <h1>Track your order ⌁</h1>

            <p class="muted">
                Enter the order ID shown in your order history.
                Tracking is a demonstration timeline; it is not connected
                to a live courier.
            </p>

            <div class="form-card">

                <label for="trackId">Order ID</label>

                <form class="track-form" id="trackForm">

                    <input
                        id="trackId"
                        inputmode="numeric"
                        placeholder="e.g. 1001"
                        required
                    >

                    <button class="btn" type="submit">
                        Find my order 
                    </button>

                </form>

                <div
                    id="trackResult"
                    class="track-result"
                    aria-live="polite"
                ></div>

            </div>

        </section>

    </main>

    <script src="products.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            base();

            const input = document.getElementById('trackId');

            const query = new URLSearchParams(
                location.search
            ).get('id');

            if (query) {
                input.value = query;
            }

            document
                .getElementById('trackForm')
                .addEventListener('submit', async e => {
                    e.preventDefault();

                    const id = input.value.trim();

                    if (!id) {
                        return;
                    }

                    const box = document.getElementById('trackResult');

                    box.innerHTML = `
                        <p class="muted">
                            Looking for your order…
                        </p>
                    `;

                    try {
                        const r = await fetch(
                            '/api/track/' + encodeURIComponent(id)
                        );

                        const data = await r.json();

                        if (!r.ok) {
                            box.innerHTML = `
                                <div class="track-error">
                                    ${
                                        data.error ||
                                        'Order not found. Check the ID in My Orders.'
                                    }
                                </div>
                            `;

                            return;
                        }

                        const stages = ['Placed', 'Confirmed', 'Processing', 'Shipped', 'Delivered'];

                        const status = data.status || 'Placed';

                        const active = status === 'Cancelled'
                            ? -1
                            : Math.max(0, stages.indexOf(status));

                        if (active < 0) {
                            box.innerHTML = `
                                <div class="track-error">
                                    <h2>
                                        Order #${data.id} — Cancelled
                                    </h2>

                                    <p>
                                        This order has been cancelled.
                                        Your order history retains the
                                        cancellation record.
                                    </p>
                                </div>
                            `;

                            return;
                        }

                        box.innerHTML = `
                            <div class="info-card">

                                <div class="eyebrow">
                                    ORDER #${data.id}
                                </div>

                                <h2>
                                    ${
                                        status === 'Placed' || status === 'Confirmed'
                                            ? 'Your order is confirmed!'
                                            : status === 'Delivered'
                                                ? 'Your order has arrived!'
                                                : 'Your handmade parcel is moving through the demo timeline.'
                                    }
                                </h2>

                                <div class="track-meta">

                                    <div>
                                        <small>Order placed</small>

                                        <strong>
                                            ${
                                                new Date(
                                                    data.created_at
                                                ).toLocaleDateString('en-IN')
                                            }
                                        </strong>
                                    </div>

                                    <div>
                                        <small>Order total</small>

                                        <strong>
                                            ₹${
                                                Number(
                                                    data.total
                                                ).toLocaleString('en-IN')
                                            }
                                        </strong>
                                    </div>

                                    <div>
                                        <small>Current status</small>
                                        <strong>${status}</strong>
                                    </div>

                                </div>

                                <div class="track-timeline">

                                    ${stages.map((s, i) => `
                                        <div class="track-step ${
                                            i <= active ? 'done' : ''
                                        }">

                                            <div class="dot">
                                                ${
                                                    i < active
                                                        ? '✓'
                                                        : String(i + 1).padStart(2, '0')
                                                }
                                            </div>

                                            <strong>${s}</strong>

                                            <p>
                                                ${
                                                    i === 0
                                                        ? 'We have recorded your order.'
                                                        : i === 1
                                                            ? 'The handmade parcel is being prepared.'
                                                            : i === 2
                                                                ? 'The parcel is travelling to you.'
                                                                : 'Your parcel has reached its destination.'
                                                }
                                            </p>

                                        </div>
                                    `).join('')}

                                </div>

                                <p
                                    class="muted"
                                    style="margin-top: 18px"
                                >
                                    Demo note: these steps illustrate
                                    the tracking experience and do not
                                    represent live shipping data.
                                </p>

                            </div>
                        `;

                    } catch {
                        box.innerHTML = `
                            <div class="track-error">
                                Could not connect to Artify. Start the
                                Node.js server and open this page through
                                localhost:3000.
                            </div>
                        `;
                    }
                });

            if (query) {
                document
                    .getElementById('trackForm')
                    .requestSubmit();
            }
        });
    </script>

</body>

</html>
